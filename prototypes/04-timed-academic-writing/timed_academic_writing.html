<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timed Academic Writing Practice</title>
  <style>
    :root {
      --ets-blue: #244c9f;
      --ets-dark-blue: #17366f;
      --ets-light-blue: #dce8fb;
      --line: #9ea7b3;
      --soft-line: #d8dce3;
      --panel: #f6f7f9;
      --text: #151922;
      --muted: #4b5565;
      --danger: #c51f1a;
      --focus: #1e5bc6;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #e9edf3;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
    }

    body {
      overflow: hidden;
    }

    .exam-shell {
      display: grid;
      grid-template-rows: 42px 46px 1fr 56px;
      width: 100vw;
      height: 100vh;
      min-width: 980px;
      background: white;
    }

    .top-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: linear-gradient(#2e61ba, var(--ets-blue));
      color: white;
      border-bottom: 1px solid var(--ets-dark-blue);
      font-weight: 700;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 260px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 88px;
      height: 24px;
      background: white;
      color: var(--ets-blue);
      border-radius: 2px;
      font-size: 17px;
      letter-spacing: 0;
      font-weight: 800;
    }

    .section-title {
      flex: 1;
      text-align: center;
      font-size: 16px;
      letter-spacing: 0;
    }

    .question-index {
      min-width: 260px;
      text-align: right;
      font-size: 13px;
      font-weight: 600;
    }

    .status-bar {
      display: grid;
      grid-template-columns: 1fr 320px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      background: #f7f9fc;
    }

    .directions {
      height: 100%;
      display: flex;
      align-items: center;
      padding: 0 22px;
      color: #111827;
      font-size: 15px;
      font-weight: 700;
    }

    .timer-box {
      height: 100%;
      display: grid;
      grid-template-columns: 116px 1fr;
      align-items: center;
      border-left: 1px solid var(--line);
      background: #eef3fb;
    }

    .timer-label {
      padding-left: 16px;
      color: #263247;
      font-weight: 700;
    }

    .timer {
      justify-self: start;
      min-width: 82px;
      padding: 4px 10px 3px;
      border: 1px solid #7084ad;
      background: white;
      color: #111827;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.1;
    }

    .timer.warning {
      color: var(--danger);
      border-color: var(--danger);
      animation: blink 1s steps(2, start) infinite;
    }

    @keyframes blink {
      50% {
        color: white;
        background: var(--danger);
      }
    }

    .main {
      display: grid;
      grid-template-columns: 1fr;
      min-height: 0;
      border-bottom: 1px solid var(--line);
    }

    .writing-pane {
      min-width: 0;
      min-height: 0;
      background: white;
    }

    .pane-heading {
      display: flex;
      align-items: center;
      padding: 0 18px;
      border-bottom: 1px solid var(--soft-line);
      background: var(--panel);
      color: #202938;
      font-size: 15px;
      font-weight: 700;
    }

    .writing-pane {
      display: grid;
      grid-template-rows: 42px 1fr 42px;
    }

    .answer-wrap {
      padding: 16px 18px 12px;
      min-height: 0;
    }

    textarea {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 360px;
      resize: none;
      padding: 14px 16px;
      border: 1px solid #7e8795;
      outline: none;
      background: white;
      color: #111827;
      font: 16px/1.55 Arial, Helvetica, sans-serif;
    }

    textarea:focus {
      border-color: var(--focus);
      box-shadow: inset 0 0 0 1px var(--focus);
    }

    .word-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 0 18px;
      border-top: 1px solid var(--soft-line);
      background: #f7f7f7;
      color: #222b3a;
      font-weight: 700;
    }

    .word-count {
      display: inline-grid;
      place-items: center;
      min-width: 56px;
      height: 24px;
      border: 1px solid #9ca3af;
      background: white;
      font-weight: 700;
    }

    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: #eef1f6;
    }

    .utility-buttons,
    .nav-buttons {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      min-width: 84px;
      height: 32px;
      padding: 0 14px;
      border: 1px solid #667085;
      border-radius: 2px;
      background: linear-gradient(#ffffff, #dde3ed);
      color: #101828;
      font: 700 13px Arial, Helvetica, sans-serif;
      cursor: pointer;
    }

    button:hover {
      border-color: #355fb0;
      background: linear-gradient(#ffffff, #cddaf0);
    }

    button.primary {
      min-width: 92px;
      border-color: #143b88;
      background: linear-gradient(#3b73d5, #244c9f);
      color: white;
    }

    button.primary:hover {
      background: linear-gradient(#477dde, #1d438d);
    }

    .screen-note {
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 980px) {
      body {
        overflow: auto;
      }

      .exam-shell {
        min-width: 0;
        height: auto;
        min-height: 100vh;
        grid-template-rows: auto auto auto auto;
      }

      .top-strip,
      .status-bar,
      .main,
      .bottom-bar {
        display: block;
      }

      .top-strip {
        padding: 12px 14px;
      }

      .brand,
      .section-title,
      .question-index {
        justify-content: center;
        text-align: center;
        min-width: 0;
        margin: 5px 0;
      }

      .directions {
        min-height: 44px;
      }

      .timer-box {
        min-height: 44px;
        border-left: 0;
        border-top: 1px solid var(--line);
      }

      textarea {
        min-height: 300px;
      }

      .bottom-bar {
        padding: 12px 14px;
      }

      .nav-buttons {
        margin-top: 10px;
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>
  <main class="exam-shell" aria-label="Timed academic writing practice page">
    <header class="top-strip">
      <div class="brand">
        <div class="brand-mark">PRACTICE</div>
        <span>Academic Writing</span>
      </div>
      <div class="section-title">Writing for an Academic Discussion</div>
      <div class="question-index">Question 2 of 2</div>
    </header>

    <section class="status-bar" aria-label="Status">
      <div class="directions">Your response</div>
      <div class="timer-box">
        <div class="timer-label">Time</div>
        <div id="timer" class="timer" aria-live="polite">10:00</div>
      </div>
    </section>

    <section class="main">
      <section class="writing-pane" aria-label="Answer area">
        <div class="pane-heading">Response</div>
        <div class="answer-wrap">
          <textarea id="response" spellcheck="false" autocomplete="off" autocapitalize="off" inputmode="latin" lang="en" aria-label="Type your response here"></textarea>
        </div>
        <div class="word-row">
          <span>Word Count</span>
          <span id="wordCount" class="word-count">0</span>
        </div>
      </section>
    </section>

    <footer class="bottom-bar">
      <div class="utility-buttons">
        <button id="restart" type="button">Restart</button>
        <button id="clear" type="button">Clear</button>
        <span class="screen-note">Practice screen</span>
      </div>
      <div class="nav-buttons">
        <button type="button">Back</button>
        <button class="primary" type="button">Next</button>
      </div>
    </footer>
  </main>

  <script>
    const TOTAL_SECONDS = 10 * 60;
    const WARNING_SECONDS = 2 * 60;
    const timerEl = document.getElementById("timer");
    const responseEl = document.getElementById("response");
    const wordCountEl = document.getElementById("wordCount");
    const restartBtn = document.getElementById("restart");
    const clearBtn = document.getElementById("clear");

    let remaining = TOTAL_SECONDS;
    let intervalId = null;

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}:${String(secs).padStart(2, "0")}`;
    }

    function renderTimer() {
      timerEl.textContent = formatTime(remaining);
      timerEl.classList.toggle("warning", remaining > 0 && remaining <= WARNING_SECONDS);
    }

    function startTimer() {
      clearInterval(intervalId);
      intervalId = setInterval(() => {
        remaining = Math.max(0, remaining - 1);
        renderTimer();
        if (remaining === 0) {
          clearInterval(intervalId);
          responseEl.disabled = true;
        }
      }, 1000);
    }

    function countWords(value) {
      const matches = value.trim().match(/[A-Za-z0-9]+(?:[-'][A-Za-z0-9]+)*/g);
      return matches ? matches.length : 0;
    }

    function updateWordCount() {
      wordCountEl.textContent = String(countWords(responseEl.value));
    }

    function isAllowedTypingText(text) {
      return /^[\u0009\u000a\u000d\u0020-\u007e]*$/.test(text);
    }

    function removeBlockedCharacters() {
      const start = responseEl.selectionStart;
      const end = responseEl.selectionEnd;
      const before = responseEl.value;
      const after = before.replace(/[^\u0009\u000a\u000d\u0020-\u007e]/g, "");

      if (before !== after) {
        const removedBeforeStart = before
          .slice(0, start)
          .replace(/[\u0009\u000a\u000d\u0020-\u007e]/g, "")
          .length;
        const removedBeforeEnd = before
          .slice(0, end)
          .replace(/[\u0009\u000a\u000d\u0020-\u007e]/g, "")
          .length;

        responseEl.value = after;
        const nextStart = Math.max(0, start - removedBeforeStart);
        const nextEnd = Math.max(0, end - removedBeforeEnd);
        responseEl.setSelectionRange(nextStart, nextEnd);
      }
    }

    responseEl.addEventListener("compositionstart", (event) => {
      event.preventDefault();
    });

    responseEl.addEventListener("compositionupdate", (event) => {
      event.preventDefault();
    });

    responseEl.addEventListener("compositionend", (event) => {
      event.preventDefault();
      removeBlockedCharacters();
      updateWordCount();
    });

    responseEl.addEventListener("beforeinput", (event) => {
      if (event.inputType === "insertFromPaste" || event.inputType === "insertFromDrop") {
        return;
      }

      if (event.inputType && event.inputType.toLowerCase().includes("composition")) {
        event.preventDefault();
        return;
      }

      if (typeof event.data === "string" && !isAllowedTypingText(event.data)) {
        event.preventDefault();
      }
    });

    responseEl.addEventListener("keydown", (event) => {
      if (event.ctrlKey || event.metaKey || event.altKey) {
        return;
      }
      if (event.isComposing || event.key === "Process") {
        event.preventDefault();
      }
    });

    responseEl.addEventListener("input", () => {
      removeBlockedCharacters();
      updateWordCount();
    });

    restartBtn.addEventListener("click", () => {
      remaining = TOTAL_SECONDS;
      responseEl.disabled = false;
      renderTimer();
      startTimer();
      responseEl.focus();
    });

    clearBtn.addEventListener("click", () => {
      responseEl.value = "";
      updateWordCount();
      responseEl.focus();
    });

    renderTimer();
    startTimer();
    responseEl.focus();
  </script>
</body>
</html>
