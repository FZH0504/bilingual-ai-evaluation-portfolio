input_file: data/input.xlsx
input_sheet: data
external_metrics_file: data/external_metrics.xlsx
aligned_segments_sheet: aligned_segments

condition_a: fixed_few_shot
condition_b: adaptive_few_shot

comet_model: Unbabel/wmt22-comet-da
preferred_device: auto
initial_batch_size: 8
fallback_batch_sizes: [4, 2, 1]
fallback_to_cpu: true
text_level_aggregation: arithmetic_mean
primary_metric: comet_score

compute_sentence_transformer_similarity: false
sentence_transformer_model: sentence-transformers/all-MiniLM-L6-v2
short_output_word_threshold: 20
low_power_n_threshold: 20
random_seed: 20260702

